# Minimal local smoke run: tiny synthetic JSONL + 1 epoch. Not for real metrics.

project:
  name: offline_ai_code_detector
  experiment_name: m1_code_detector_smoke
  random_seed: 42

data:
  train_path: data/processed/train.jsonl
  validation_path: data/processed/val.jsonl
  test_path: data/processed/test.jsonl
  file_format: jsonl
  code_column: code
  label_column: label
  language_column: language
  source_dataset_column: source_dataset
  language_allowlist:
    - python
    - java
  min_tokens: 0

model:
  model_name: artifacts/models/pretrained/microsoft-codebert-base
  local_files_only: true
  max_length: 128
  batch_size: 2
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_epochs: 1
  warmup_ratio: 0.1
  gradient_accumulation_steps: 2
  save_total_limit: 1
  logging_steps: 5
  metric_for_best_model: f1
  early_stopping_patience: null
  resume_from_checkpoint: false

calibration:
  method: temperature_scaling
  enabled: false
  ece_bins: 10
  risk_target: 0.05
  report_top_k_thresholds: 5

thresholds:
  lower: 0.35
  upper: 0.65

outputs:
  model_dir: artifacts/models/m1_code_detector_smoke
  report_dir: artifacts/reports
  figures_dir: artifacts/figures

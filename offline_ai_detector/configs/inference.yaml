# Inference config for the pretrained detector.
#
# model_dir: path to the saved checkpoint directory (produced by download_pretrained.py).
# calibration_path: set to null — we use raw softmax scores from the pretrained model.
#                   Re-enable after running calibrate_model.py on the custom-trained model.
# language_allowlist: only python and java are supported.
# min_tokens: below this a reduced-confidence note is added to the output.
# max_length: tokenizer truncation limit.
# local_files_only: set to true after download_pretrained.py has run successfully.

runtime:
  model_dir: artifacts/models/m1_code_detector_smoke
  calibration_path: null
  language_allowlist:
    - python
    - java
  min_tokens: 50
  max_length: 512
  local_files_only: false

# Threshold band for the abstain / unclear zone.
# These defaults are conservative — adjust after inspecting real scores.
thresholds:
  lower: 0.35
  upper: 0.65

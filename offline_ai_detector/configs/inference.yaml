# Inference: local checkpoint + optional calibration (no Hugging Face Inference API).
# model_dir / calibration_path are updated by run_full_capstone_pipeline.py --sync-inference after train+calibrate.

runtime:
  model_dir: artifacts/models/m1_code_detector_smoke
  calibration_path: artifacts/models/m1_code_detector_smoke/calibration.json
  language_allowlist:
    - python
    - java
  min_tokens: 50
  max_length: 512
  local_files_only: true

thresholds:
  lower: 0.35
  upper: 0.65

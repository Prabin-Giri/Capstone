name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            export APP_DIR="${{ secrets.EC2_APP_DIR }}"
            export PM2_APP_NAME="${{ secrets.EC2_PM2_APP_NAME }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/Capstone"
            fi
            if [ -z "$PM2_APP_NAME" ]; then
              PM2_APP_NAME="autograde-backend"
            fi
            bash "$APP_DIR/server/scripts/deploy-ec2.sh"

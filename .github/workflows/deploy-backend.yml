name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"
            DEFAULT_APP_DIR="$HOME/Capstone"
            export APP_DIR="${{ secrets.EC2_APP_DIR }}"
            export PM2_APP_NAME="${{ secrets.EC2_PM2_APP_NAME }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$DEFAULT_APP_DIR"
            fi
            if [ -z "$PM2_APP_NAME" ]; then
              PM2_APP_NAME="autograde-backend"
            fi
            SCRIPT_PATH=""
            if [ -n "$APP_DIR" ] && [ -f "$APP_DIR/server/scripts/deploy-ec2.sh" ]; then
              SCRIPT_PATH="$APP_DIR/server/scripts/deploy-ec2.sh"
            elif [ -n "$APP_DIR" ] && [ -f "$APP_DIR/scripts/deploy-ec2.sh" ]; then
              SCRIPT_PATH="$APP_DIR/scripts/deploy-ec2.sh"
            fi

            if [ -z "$SCRIPT_PATH" ]; then
              for candidate in \
                "$HOME/Capstone/server/scripts/deploy-ec2.sh" \
                "$HOME/capstone/server/scripts/deploy-ec2.sh" \
                "/home/ubuntu/Capstone/server/scripts/deploy-ec2.sh"; do
                if [ -f "$candidate" ]; then
                  SCRIPT_PATH="$candidate"
                  break
                fi
              done
            fi

            if [ -z "$SCRIPT_PATH" ]; then
              SCRIPT_PATH="$(find "$HOME" -maxdepth 6 -type f -path '*/server/scripts/deploy-ec2.sh' 2>/dev/null | head -n 1)"
            fi

            if [ -z "$SCRIPT_PATH" ]; then
              echo "[deploy] deploy script not found; bootstrapping repository at $DEFAULT_APP_DIR"
              export APP_DIR="$DEFAULT_APP_DIR"
              if [ ! -d "$APP_DIR/.git" ]; then
                mkdir -p "$(dirname "$APP_DIR")"
                git clone "$REPO_URL" "$APP_DIR"
              else
                cd "$APP_DIR"
                git fetch origin main
                git checkout main || git checkout -B main origin/main
                git reset --hard origin/main
                git clean -fd
              fi
              SCRIPT_PATH="$APP_DIR/server/scripts/deploy-ec2.sh"
            fi

            if [ ! -f "$SCRIPT_PATH" ]; then
              echo "[deploy] deploy script still missing after bootstrap"
              echo "[deploy] expected at $SCRIPT_PATH"
              exit 1
            fi

            export APP_DIR="$(cd "$(dirname "$SCRIPT_PATH")/../.." && pwd)"
            echo "[deploy] using script: $SCRIPT_PATH"
            echo "[deploy] resolved app dir: $APP_DIR"

            # ── Disk cleanup (runs BEFORE deploy script) ──
            echo "[deploy] running pre-deploy disk cleanup..."
            df -h /
            sudo apt-get clean || true
            sudo apt-get autoremove -y || true
            npm cache clean --force || true
            python3 -m pip cache purge 2>/dev/null || true
            if [ -d "$APP_DIR/offline_ai_detector/.venv" ]; then
              "$APP_DIR/offline_ai_detector/.venv/bin/python" -m pip cache purge 2>/dev/null || true
            fi
            pm2 flush 2>/dev/null || true
            rm -rf /tmp/ai-detector-* || true
            echo "[deploy] disk after cleanup:"
            df -h /
            # ── End cleanup ──

            # ── Pull latest code BEFORE running deploy script ──
            # This ensures bash runs the NEWEST deploy-ec2.sh, not the stale one.
            echo "[deploy] pulling latest code to update deploy script..."
            cd "$APP_DIR"
            git fetch origin main
            git checkout main || git checkout -B main origin/main
            git reset --hard origin/main
            git clean -fd
            echo "[deploy] deploy script updated, now executing..."
            # ── End pull ──

            # ── Clean corrupted venv from previous failed installs ──
            rm -rf "$APP_DIR/offline_ai_detector/.venv" || true
            # ── End venv cleanup ──

            bash "$SCRIPT_PATH"
